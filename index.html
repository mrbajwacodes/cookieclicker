<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker: Mrbajwa</title>
    <link rel="icon" type="image/png" href="cookie.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-layout">
        <div class="left-column">
            <div class="game-container">
                <h1>Cookies: <span id="cookie-count">0</span></h1><br>
                <h6>Cookies Per Second: <span id="cookies-per-second">0</span></h6>
                <button id="cookie-btn">🍪</button>
                <h6>Click Power: <span id="clickMulti">1</span></h6>
            </div>
            <div class="stat-viewer">
                <h1>Total Cookies: <span id="total-cookies">0</span></h1>
                <h1>Total Cookies Clicked: <span id="total-cookies-clicked">0</span></h1>
                <h1>Total Cookies Spent: <span id="total-cookies-spent">0</span></h1>
                <h1>Total Clicks: <span id="total-clicks">0</span></h1>
            </div>
        </div>

        <div class="upgrades">
            <h1>Upgrades Shop</h1>
        </div>
    </div>

    <div class="saving">
        <button id="save">Save</button>
        <button id="delete">Delete Save</button><br><br>
        <h5>Game automatically saves every 5 seconds</h5>
    </div>

    <script src="script.js"></script>
</body>
</html>
